trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  SONAR_SERVICE_CONNECTION: 'sonarcloud-service-connection'
  SONAR_ORGANIZATION: 'khandrasekhar'
  SONAR_PROJECT_KEY: 'khandrasekhar'
  SONAR_PROJECT_NAME: 'Simple FastAPI Student App'

steps:
- task: UsePythonVersion@0
  displayName: 'Use Python 3.12'
  inputs:
    versionSpec: '3.12'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install Dependencies'

- script: |
    python -m py_compile main.py
  displayName: 'Check Python Syntax'

- task: SonarCloudPrepare@1
  displayName: 'Prepare SonarCloud analysis'
  inputs:
    SonarCloud: '$(SONAR_SERVICE_CONNECTION)'
    organization: '$(SONAR_ORGANIZATION)'
    scannerMode: 'CLI'
    configMode: 'manual'
    cliProjectKey: '$(SONAR_PROJECT_KEY)'
    cliProjectName: '$(SONAR_PROJECT_NAME)'
    extraProperties: |
      sonar.sources=.
      sonar.python.version=3.12

- script: |
    python -m pip install coverage
    coverage run -m pytest || true
  displayName: 'Run tests for coverage'
  condition: succeededOrFailed()

- task: SonarCloudAnalyze@1
  displayName: 'Run SonarCloud analysis'

- task: SonarCloudPublish@1
  displayName: 'Publish SonarCloud results'

- script: |
    timeout 15s python -m uvicorn main:app --host 0.0.0.0 --port 8000 || true
  displayName: 'Start FastAPI Application'
